server {
    listen 80;
    server_name dhruvmodi.online www.dhruvmodi.online;

    # Redirect HTTP → HTTPS (enable after certbot)
    # return 301 https://$host$request_uri;

    client_max_body_size 10M;

    # Next.js storefront + admin UI
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Express API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Local disk uploads served by API
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /health {
        proxy_pass http://127.0.0.1:4000/health;
    }

    location /sitemap.xml {
        proxy_pass http://127.0.0.1:4000/sitemap.xml;
    }

    location /robots.txt {
        proxy_pass http://127.0.0.1:4000/robots.txt;
    }
}
