{% extends "admin/base.html" %}
{% block title %}Coupons{% endblock %}
{% block admin %}
<h1>Coupons</h1>
<form method="post" class="card grid" style="gap:.5rem;margin:1rem 0">
  <input class="input" name="code" required placeholder="CODE">
  <select class="input" name="type">
    <option value="percent">Percent</option>
    <option value="fixed">Fixed ₹</option>
  </select>
  <input class="input" name="value" type="number" step="0.01" required placeholder="Value">
  <input class="input" name="minPurchase" type="number" step="0.01" placeholder="Min purchase">
  <input class="input" name="maxUses" type="number" placeholder="Max uses">
  <label><input type="checkbox" name="active" checked> Active</label>
  <button class="btn" type="submit">Save coupon</button>
</form>
<table>
  {% for c in items %}
  <tr>
    <td>{{ c.code }}</td>
    <td>{{ c.type }} {{ c.value }}</td>
    <td>{{ c.usedCount }}/{{ c.maxUses or "∞" }}</td>
    <td><form method="post"><input type="hidden" name="id" value="{{ c.id }}"><button name="action" value="delete" class="btn-secondary">Delete</button></form></td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
