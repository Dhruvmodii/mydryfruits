{% extends "admin/base.html" %}
{% block title %}Collections{% endblock %}
{% block admin %}
<h1>Collections</h1>
<form method="post" class="card grid" style="gap:.5rem;margin:1rem 0">
  <input class="input" name="name" required placeholder="Name">
  <textarea class="input" name="description" placeholder="Description"></textarea>
  <select class="input" name="productIds" multiple size="6">
    {% for p in products %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
  </select>
  <button class="btn" type="submit">Save collection</button>
</form>
<table>
  {% for i in items %}
  <tr>
    <td>{{ i.name }}</td>
    <td>{{ i.items|length }} items</td>
    <td><form method="post"><input type="hidden" name="id" value="{{ i.id }}"><button name="action" value="delete" class="btn-secondary">Delete</button></form></td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
