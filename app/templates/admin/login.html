{% extends "base.html" %}
{% set hide_nav = true %}
{% block title %}Admin login{% endblock %}
{% block content %}
<section class="section">
  <div class="container" style="max-width:420px">
    <div class="card">
      <p class="display" style="font-size:2rem;margin:0">MyDryFruits</p>
      <h1>Admin sign in</h1>
      {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
      <form method="post" class="grid" style="gap:.75rem">
        <input class="input" type="email" name="email" required value="admin@mydryfruits.com">
        <input class="input" type="password" name="password" required>
        <button class="btn" type="submit">Sign in</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
